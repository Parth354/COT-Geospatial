<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="centroidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </radialGradient>
  </defs>

  <!-- Container Base with rounded squircle -->
  <rect width="64" height="64" rx="14" fill="url(#gradBg)" stroke="#312e81" stroke-width="1.5" />

  <!-- Geodetic Coordinate Lat/Lon Grid Lines -->
  <!-- Outer Globe Boundary -->
  <circle cx="32" cy="32" r="22" stroke="#4338ca" stroke-width="1.2" stroke-dasharray="2 2" fill="none" opacity="0.6" />
  <circle cx="32" cy="32" r="16" stroke="#4f46e5" stroke-width="1.2" fill="none" opacity="0.7" />

  <!-- Equatorial and Meridian Crosshairs -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#6366f1" stroke-width="1.2" opacity="0.5" />
  <line x1="32" y1="10" x2="32" y2="54" stroke="#6366f1" stroke-width="1.2" opacity="0.5" />

  <!-- Topographic Curvature Contours -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#accentGrad)" stroke-width="1.4" fill="none" />
  <ellipse cx="32" cy="32" rx="11" ry="22" stroke="url(#accentGrad)" stroke-width="1.4" fill="none" />

  <!-- Precision Centroid & Geopoint Anchor -->
  <circle cx="32" cy="32" r="5" fill="url(#centroidGlow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />

  <!-- Elevation Vector Indicator -->
  <circle cx="43" cy="23" r="2.2" fill="#38bdf8" />
  <circle cx="21" cy="41" r="1.8" fill="#818cf8" />
  <line x1="32" y1="32" x2="43" y2="23" stroke="#38bdf8" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.8" />
</svg>
